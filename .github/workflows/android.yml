name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.PORTAL_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Optional: a fixed signing key so each new APK installs over the last one.
      # Add repo secrets PORTAL_KEYSTORE_B64, PORTAL_KEYSTORE_PASSWORD, PORTAL_KEY_ALIAS, PORTAL_KEY_PASSWORD.
      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.PORTAL_KEYSTORE_B64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/portal.jks"
          echo "PORTAL_KEYSTORE=$RUNNER_TEMP/portal.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          PORTAL_KEYSTORE_PASSWORD: ${{ secrets.PORTAL_KEYSTORE_PASSWORD }}
          PORTAL_KEY_ALIAS: ${{ secrets.PORTAL_KEY_ALIAS }}
          PORTAL_KEY_PASSWORD: ${{ secrets.PORTAL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      # Turn Kotlin/Gradle errors into annotations so they can be read without logging in.
      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -80 | while IFS= read -r l; do echo "::error::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: PORTAL-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # On main: publish the APK as a GitHub release, so it can be downloaded without signing in.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" PORTAL.apk
          TAG="v$(grep versionName app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "PORTAL $TAG" --notes "Download PORTAL.apk below and open it on your device." --latest
          gh release upload "$TAG" PORTAL.apk --clobber
